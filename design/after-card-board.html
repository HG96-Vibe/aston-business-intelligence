<title>After-Card Options</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;1,300&family=Albert+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500&display=swap">
<style>
  :root { --bg:#f7f5f0; --fg:#17161f; --muted:#625f6e; --card:#fff; --line:#e6e2d8; --ink:#17161f; --paper:#fff; --soft:#fbf3dc; --gold:#e9b324; --gold2:#b47a06; --accent:#c98a06; --good:#1f9d61; --bad:#c2410c; --xl:#1d6f42; --grid:#d9d9d9; --cellhead:#f3f3f3; --deep:#17161f;
    --serif:"Spectral",Georgia,serif; --sans:"Albert Sans",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#121118; --fg:#f3f1f7; --muted:#a09db0; --card:#19181f; --line:#2b2935; --ink:#f3f1f7; --paper:#121118; --soft:#26220f; --gold:#ffc93c; --accent:#ffc93c; --grid:#33313d; --cellhead:#201f28; --deep:#0c0b11; color-scheme:dark; } }
  :root[data-theme="dark"] { --bg:#121118; --fg:#f3f1f7; --muted:#a09db0; --card:#19181f; --line:#2b2935; --ink:#f3f1f7; --paper:#121118; --soft:#26220f; --gold:#ffc93c; --accent:#ffc93c; --grid:#33313d; --cellhead:#201f28; --deep:#0c0b11; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans); padding-block:24px 80px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); line-height:1.5; }
  .wrap { max-width:1100px; margin:0 auto; }
  h1 { font-family:var(--serif); font-weight:400; font-size:clamp(1.5rem,3vw,2rem); margin:0; letter-spacing:-.01em; }
  .lede { color:var(--muted); max-width:66ch; line-height:1.55; margin:8px 0 0; font-weight:300; }
  .top { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  .top button { font:inherit; font-size:13px; padding:7px 13px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  .label { display:flex; align-items:baseline; gap:12px; margin:44px 0 12px; flex-wrap:wrap; }
  .label .n { font-family:var(--mono); font-size:12px; color:var(--accent); letter-spacing:.1em; }
  .label h2 { font-family:var(--sans); font-weight:600; font-size:1rem; margin:0; }
  .label p { margin:0; color:var(--muted); font-size:13.5px; font-weight:300; flex-basis:100%; }
  .frame { border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--soft); padding:40px; display:grid; grid-template-columns:1fr 1.15fr; gap:40px; align-items:center; }
  @media (max-width:860px) { .frame { grid-template-columns:1fr; padding:20px; } }
  .copy p.m { display:inline-flex; align-items:center; gap:12px; font-family:var(--mono); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:0; } .copy p.m::before { content:""; width:28px; height:1px; background:var(--accent); }
  .copy h3 { font-family:var(--serif); font-weight:400; font-size:2.1rem; line-height:1.1; margin:14px 0 0; color:var(--ink); } .copy .em { font-style:italic; font-weight:300; color:var(--accent); }
  .copy .d { color:var(--muted); font-weight:300; margin-top:14px; font-size:14px; }
  .stage { position:relative; height:440px; width:100%; }
  .c { position:absolute; transition:transform 1.2s cubic-bezier(.2,.8,.2,1), opacity 1.2s; box-shadow:0 18px 40px -22px rgba(0,0,0,.4); }
  .stage.go .c { opacity:0; transform:translate(var(--tx),var(--ty)) scale(.5) rotate(0) !important; }
  .after { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(.92); opacity:0; transition:all 1s .9s cubic-bezier(.2,.8,.2,1); }
  .stage.go .after { opacity:1; transform:translate(-50%,-50%) scale(1); }
  .mono { font-family:var(--mono); }

  /* before cards (mixed desk, compact) */
  .xl { width:200px; background:#fff; border:1px solid var(--grid); border-radius:3px; font-size:8px; color:#222; overflow:hidden; }
  .xl .tb { display:flex; align-items:center; gap:6px; padding:3px 6px; background:var(--xl); color:#fff; font-weight:600; } .xl .tb i { width:9px; height:9px; background:#fff; border-radius:2px; display:inline-block; opacity:.9; }
  .xl table { border-collapse:collapse; width:100%; } .xl td, .xl th { border:1px solid var(--grid); padding:1px 3px; font-weight:400; white-space:nowrap; height:12px; } .xl th { background:var(--cellhead); color:#666; text-align:center; font-size:7px; } .xl td.n{text-align:right} .xl td.err{color:#c00;font-weight:600}
  .csv { width:190px; background:#fff; border:1px solid var(--line); padding:6px 8px; font-family:var(--mono); font-size:6.5px; color:#333; line-height:1.5; white-space:pre; overflow:hidden; border-radius:3px; }
  .ppt { width:190px; aspect-ratio:16/9; background:#fff; border:1px solid var(--line); border-radius:3px; padding:8px 10px; font-size:7px; position:relative; } .ppt h6 { margin:0 0 5px; font-size:8px; font-weight:600; color:#111; } .ppt .bars { display:flex; align-items:flex-end; gap:4px; height:38px; } .ppt .bars i { flex:1; background:#4472c4; } .ppt .bars i:nth-child(2n){background:#ed7d31} .ppt .stale { position:absolute; right:6px; top:6px; font-size:6px; color:#999; font-family:var(--mono); }
  .sticky { width:100px; height:92px; background:#fff59a; padding:10px; font-family:"Caveat",cursive; font-size:13px; line-height:1.1; color:#333; }

  /* ── shared dashboard bits ── */
  .db { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; font-size:11px; box-shadow:0 40px 80px -40px rgba(0,0,0,.35); }
  .db .hd { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink); }
  .db .hd .dot { width:7px; height:7px; border-radius:50%; background:var(--gold); display:inline-block; margin-right:8px; }
  .db .hd em { font-style:normal; border:1px solid var(--accent); color:var(--accent); border-radius:3px; padding:1px 5px; font-size:9px; }
  .db .sl { display:flex; gap:5px; flex-wrap:wrap; padding:6px 14px; background:var(--cellhead); border-bottom:1px solid var(--line); } .db .sl span { font-family:var(--mono); font-size:8.5px; letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--line); background:var(--card); border-radius:3px; padding:2px 6px; color:var(--ink); }
  .kp { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); } .kp div { background:var(--card); padding:10px 12px; } .kp small { display:block; font-family:var(--mono); font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); } .kp b { display:block; font-family:var(--serif); font-weight:400; font-size:21px; color:var(--ink); margin-top:2px; line-height:1; } .kp i { font-style:normal; font-size:9.5px; color:var(--good); } .kp i.dn { color:var(--bad); }
  .kp svg { display:block; width:100%; height:16px; margin-top:4px; }
  .row2 { display:grid; grid-template-columns:1.5fr 1fr; gap:1px; background:var(--line); border-top:1px solid var(--line); } .row2 > div { background:var(--card); padding:10px 12px 6px; } .row2 p { margin:0 0 4px; font-family:var(--mono); font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .line { width:100%; height:64px; display:block; }
  .bars { display:flex; align-items:flex-end; gap:5px; height:56px; } .bars i { flex:1; background:var(--gold); border-radius:2px 2px 0 0; } .bars + div { display:flex; gap:5px; } .bars + div span { flex:1; font-family:var(--mono); font-size:6.5px; text-transform:uppercase; color:var(--muted); text-align:center; }
  .rows div { display:flex; justify-content:space-between; padding:6px 12px; border-top:1px solid var(--line); } .rows .ok{color:var(--good)} .rows .wn{color:var(--accent)}
  .ft { display:flex; justify-content:space-between; padding:8px 14px; background:var(--cellhead); font-family:var(--mono); font-size:8.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--good); border-top:1px solid var(--line); }

  /* 1 executive */
  .ex { width:470px; }
  /* 2 report page with rail */
  .rp { width:500px; display:grid; grid-template-columns:96px 1fr; }
  .rp .rail { background:var(--cellhead); border-right:1px solid var(--line); padding:10px; font-size:8.5px; } .rp .rail p { margin:8px 0 3px; font-family:var(--mono); font-size:7.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); } .rp .rail label { display:flex; gap:5px; align-items:center; color:var(--ink); padding:2px 0; } .rp .rail label i { width:8px; height:8px; border:1px solid var(--muted); border-radius:2px; display:inline-block; } .rp .rail label i.on { background:var(--gold); border-color:var(--gold); }
  .rp .main .kp { grid-template-columns:repeat(3,1fr); }
  .rp .pages { display:flex; gap:10px; padding:6px 12px; border-top:1px solid var(--line); font-family:var(--mono); font-size:8px; color:var(--muted); } .rp .pages span.on { color:var(--ink); border-bottom:2px solid var(--gold); }
  /* 3 board pack */
  .bp { width:430px; background:#fff; border:1px solid var(--line); padding:22px 26px; font-size:10px; color:#222; box-shadow:0 40px 80px -40px rgba(0,0,0,.35); font-family:var(--sans); }
  .bp .t { display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid #17161f; padding-bottom:6px; } .bp .t h4 { margin:0; font-family:var(--serif); font-weight:400; font-size:16px; } .bp .t span { font-family:var(--mono); font-size:8px; letter-spacing:.1em; text-transform:uppercase; color:#777; }
  .bp .k { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:12px 0; } .bp .k small { display:block; font-family:var(--mono); font-size:7.5px; letter-spacing:.1em; text-transform:uppercase; color:#777; } .bp .k b { display:block; font-family:var(--serif); font-weight:400; font-size:18px; } .bp .k i { font-style:normal; font-size:8.5px; color:var(--good); }
  .bp h5 { margin:10px 0 4px; font-family:var(--mono); font-size:7.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold2); }
  .bp p { margin:0; font-size:9.5px; color:#333; line-height:1.45; }
  .bp table { border-collapse:collapse; width:100%; font-size:8.5px; margin-top:4px; } .bp td { padding:3px 2px; border-bottom:1px solid #eee; } .bp td.n { text-align:right; font-variant-numeric:tabular-nums; } .bp td.g { color:var(--good); } .bp td.b { color:var(--bad); }
  .bp .ft { background:none; border-top:1px solid #ddd; padding:8px 0 0; margin-top:10px; font-size:7.5px; color:var(--good); }
  :root:not([data-theme="light"]) .bp { background:#1e1d26; color:#eee; } :root:not([data-theme="light"]) .bp p { color:#ccc; } :root:not([data-theme="light"]) .bp .t { border-color:#eee; }
  /* 4 desktop + phone */
  .pair { position:relative; width:500px; height:340px; }
  .pair .db.ex { position:absolute; left:0; top:0; width:420px; }
  .phone { position:absolute; right:0; bottom:0; width:150px; border:6px solid #17161f; border-radius:22px; background:var(--card); overflow:hidden; font-size:9px; box-shadow:0 30px 60px -30px rgba(0,0,0,.5); }
  .phone .hd { padding:8px 10px 4px; font-family:var(--mono); font-size:7.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); } .phone .kp { grid-template-columns:1fr 1fr; } .phone .kp div { padding:7px 9px; } .phone .kp b { font-size:15px; } .phone .ft { font-size:6.5px; padding:6px 9px; }
  /* 5 dark glass */
  .dk { width:470px; background:var(--deep); color:#fff; border:1px solid rgba(255,201,60,.25); border-radius:10px; overflow:hidden; font-size:11px; box-shadow:0 40px 80px -36px rgba(0,0,0,.6); }
  .dk .hd { display:flex; justify-content:space-between; padding:10px 14px; border-bottom:1px solid rgba(255,255,255,.1); font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; } .dk .hd em { font-style:normal; color:#ffc93c; border:1px solid #ffc93c; border-radius:3px; padding:1px 5px; font-size:9px; }
  .dk .kp { grid-template-columns:repeat(4,1fr); background:rgba(255,255,255,.08); } .dk .kp div { background:var(--deep); } .dk .kp small { color:rgba(255,255,255,.5); } .dk .kp b { color:#fff; font-size:22px; } .dk .kp i { color:#7fd1a5; } .dk .kp i.dn { color:#ffb37f; }
  .dk .body { padding:12px 14px 4px; border-top:1px solid rgba(255,255,255,.1); } .dk .body p { margin:0 0 4px; font-family:var(--mono); font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.5); }
  .dk .ft { background:rgba(255,201,60,.08); color:#ffc93c; border-top:1px solid rgba(255,255,255,.1); }
</style>

<div class="wrap">
  <div class="top">
    <div><h1>The "after" card — five options</h1><p class="lede">Mixed-desk files collapse into each of these. All are larger than the current card; they differ in how much of a dashboard they show and in register.</p></div>
    <button type="button" id="theme">Night</button>
  </div>
  <div id="board"></div>
</div>

<script>
document.getElementById("theme").addEventListener("click", () => { const r=document.documentElement; const dark=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches); r.setAttribute("data-theme",dark?"light":"dark"); theme.textContent=dark?"Night":"Day"; });

const spark=(pts,w=300,h=64,fill=true)=>{const max=Math.max(...pts),min=Math.min(...pts);const xy=pts.map((p,i)=>[i/(pts.length-1)*w,h-((p-min)/(max-min||1))*(h-8)-4]);const d=xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="line">${[.25,.5,.75].map(g=>`<line x1="0" x2="${w}" y1="${h*g}" y2="${h*g}" stroke="var(--line)" stroke-width="1"/>`).join("")}${fill?`<path d="${d} L${w} ${h} L0 ${h} Z" fill="var(--gold)" opacity=".12"/>`:""}<path d="${d}" fill="none" stroke="var(--gold)" stroke-width="2"/><circle cx="${xy.at(-1)[0]}" cy="${xy.at(-1)[1]}" r="3.5" fill="var(--gold)"/></svg>`;};
const mini=(pts)=>{const w=100,h=16,max=Math.max(...pts),min=Math.min(...pts);const d=pts.map((p,i)=>(i?"L":"M")+(i/(pts.length-1)*w).toFixed(1)+" "+(h-((p-min)/(max-min||1))*(h-2)-1).toFixed(1)).join(" ");return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--gold)" stroke-width="1.5"/></svg>`;};
const KP=(sparks=false)=>`<div class="kp">
  <div><small>Revenue MTD</small><b>£412k</b><i>+6.1% vs plan</i>${sparks?mini([31,34,33,37,40,43,45,48,51,53]):""}</div>
  <div><small>Gross margin</small><b>38.2%</b><i>+1.4 pts</i>${sparks?mini([35,36,35.5,37,36.8,37.4,38,37.9,38.2,38.2]):""}</div>
  <div><small>Cash runway</small><b>7.4 mo</b><i>+0.6</i>${sparks?mini([6,6.2,6.1,6.5,6.8,6.7,7,7.1,7.3,7.4]):""}</div>
  <div><small>Debtors &gt; 60d</small><b>£61k</b><i class="dn">−£18k</i>${sparks?mini([82,80,79,77,74,72,70,66,63,61]):""}</div></div>`;
const BARS=`<div class="bars"><i style="height:92%"></i><i style="height:80%;opacity:.88"></i><i style="height:72%;opacity:.76"></i><i style="height:60%;opacity:.64"></i><i style="height:46%;opacity:.52"></i><i style="height:34%;opacity:.4"></i></div><div><span>Acme</span><span>Birch</span><span>Cole</span><span>Dunn</span><span>Ealing</span><span>Fox</span></div>`;
const ROWS=`<div class="rows"><div><span>Month-end close</span><span class="ok">1 day</span></div><div><span>Reconciled to Xero</span><span class="ok">14 / 14</span></div><div><span>Clients below 25% margin</span><span class="wn">12 of 40</span></div></div>`;

const afters = {
  A: { title:"Executive summary", desc:"The current card grown up: slicers, four KPIs each with a tiny sparkline, revenue line, margin-by-client bars, three status rows, reconciliation footer. One clear screen.",
    html:`<div class="db ex"><div class="hd"><span><span class="dot"></span>Finance · month-end</span><em>example</em></div><div class="sl"><span>FY 2026 ▾</span><span>All sites ▾</span><span>GBP ▾</span><span>vs plan</span></div>${KP(true)}<div class="row2"><div><p>Revenue, last 12 months</p>${spark([31,34,33,37,40,39,43,45,44,48,51,53])}</div><div><p>Margin by client</p>${BARS}</div></div>${ROWS}<div class="ft"><span>✓ Reconciled to Xero · 06:02</span><span>Power BI · refreshed daily</span></div></div>` },
  B: { title:"Report page with filter rail", desc:"Closest to what a Power BI report actually looks like: a left rail of filters with checkboxes, page tabs along the bottom (Overview · Cash · Margin · Pipeline). Most literal.",
    html:`<div class="db rp"><div class="rail"><p>Period</p><label><i class="on"></i>Oct 2026</label><label><i></i>Sep 2026</label><label><i></i>Q3</label><p>Site</p><label><i class="on"></i>All</label><label><i></i>London</label><label><i></i>Croydon</label><p>View</p><label><i class="on"></i>vs plan</label><label><i></i>vs last year</label></div><div class="main"><div class="hd"><span><span class="dot"></span>Overview</span><em>example</em></div><div class="kp"><div><small>Revenue MTD</small><b>£412k</b><i>+6.1%</i></div><div><small>Gross margin</small><b>38.2%</b><i>+1.4 pts</i></div><div><small>Debtors &gt; 60d</small><b>£61k</b><i class="dn">−£18k</i></div></div><div class="row2"><div><p>Revenue vs plan</p>${spark([31,34,33,37,40,39,43,45,44,48,51,53])}</div><div><p>By client</p>${BARS}</div></div><div class="pages"><span class="on">Overview</span><span>Cash</span><span>Margin</span><span>Pipeline</span><span>Board pack</span></div><div class="ft"><span>✓ Reconciled · 06:02</span><span>14 / 14</span></div></div></div>` },
  C: { title:"The board pack page", desc:"Not a screen — the document it produces. An A4-style page: headline KPIs, two lines of commentary, a variance table, reconciliation note. Says 'the pack writes itself'.",
    html:`<div class="bp"><div class="t"><h4>Monthly board pack · October 2026</h4><span>Generated 3 Nov · 06:00</span></div><div class="k"><div><small>Revenue</small><b>£412k</b><i>+6.1% vs plan</i></div><div><small>Gross margin</small><b>38.2%</b><i>+1.4 pts</i></div><div><small>Cash runway</small><b>7.4 mo</b><i>+0.6</i></div><div><small>Debtors &gt; 60d</small><b>£61k</b><i style="color:var(--bad)">−£18k</i></div></div><h5>Commentary</h5><p>Revenue ahead of plan on Services; Licences flat. Twelve clients remain below 25% margin — three account for 80% of the gap. Debtors over 60 days down for the third month.</p><h5>Variance to plan</h5><table><tr><td>Services</td><td class="n">238k</td><td class="n g">+14k</td></tr><tr><td>Licences</td><td class="n">112k</td><td class="n">+1k</td></tr><tr><td>Support</td><td class="n">62k</td><td class="n b">−4k</td></tr></table><h5>Decisions required</h5><p>1. Re-price or exit the three lowest-margin accounts. 2. Approve credit control change for Fox.</p><div class="ft">✓ All figures reconciled to Xero · 14 of 14 reports tie back</div></div>` },
  D: { title:"Desktop and phone", desc:"The executive card with a phone overlapping its corner showing the same four numbers. Says 'one set of numbers, any device' — useful for owners who live on their phone.",
    html:`<div class="pair"><div class="db ex"><div class="hd"><span><span class="dot"></span>Finance · month-end</span><em>example</em></div>${KP(false)}<div class="row2"><div><p>Revenue, last 12 months</p>${spark([31,34,33,37,40,39,43,45,44,48,51,53])}</div><div><p>Margin by client</p>${BARS}</div></div><div class="ft"><span>✓ Reconciled to Xero · 06:02</span><span>Power BI</span></div></div><div class="phone"><div class="hd">Monday 07:12</div><div class="kp"><div><small>Revenue</small><b>£412k</b><i>+6.1%</i></div><div><small>Margin</small><b>38.2%</b><i>+1.4</i></div><div><small>Cash</small><b>7.4 mo</b><i>+0.6</i></div><div><small>Debtors</small><b>£61k</b><i class="dn">−18k</i></div></div><div class="ft"><span>✓ Reconciled</span><span>06:02</span></div></div></div>` },
  E: { title:"Charcoal glass", desc:"Same content as A on a charcoal card with gold line and a gold-tinted footer. Strongest contrast against the scattered white files — the 'after' feels like a different world.",
    html:`<div class="dk"><div class="hd"><span>Finance · month-end</span><em>example</em></div>${KP(false)}<div class="body"><p>Revenue, last 12 months</p>${spark([31,34,33,37,40,39,43,45,44,48,51,53],300,70,false)}</div><div class="body" style="padding-top:4px"><p>Margin by client, top 6</p>${BARS}</div><div class="ft"><span>✓ Reconciled to Xero · 06:02</span><span>14 / 14 tie back</span></div></div>` },
};

const before = [
